<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NC‑MAIBOARD / AUTO‑ENGINE</title>

<style>
  body { background:#111; color:#eee; font-family:monospace; }
  .board { padding:20px; border:1px solid #444; margin:20px; }
  .entry { padding:6px; margin:4px 0; border-bottom:1px solid #333; }
  .question { color:#6cf; }
  .value { color:#fc6; }
</style>
</head>

<body>

<h1>NC‑MAIBOARD / AUTO‑ENGINE</h1>
<div id="board" class="board"></div>

<script>

// ------------------------------------------------------
// RESPO / AXIOM-PRÜFER
// ------------------------------------------------------
function ghostScan(r){
  if(r.MISS){
    return {
      NAME: r.NAME,
      RESULT: "FEHLT",
      ERROR: true,
      RAUM: "(keine Daten)"
    };
  }

  const WETTE = r.IST_IST !== r.SOLL;

  const SCORE =
      (r.STATUS === "1" ? 1 : 0) +
      (r.VERWALTUNG3.SET.UP ? 1 : 0) +
      (r.VERWALTUNG3.IO.IN ? 1 : 0) +
      (r.VERWALTUNG3.EXE.RUN ? 1 : 0) +
      (r.WAHRHEIT === "REAL" ? 1 : 0) +
      (r.RAUM.X + r.RAUM.Z);

  return {
    NAME: r.NAME,
    ID: r.ID,
    RAUM: r.RAUM,
    STATUS: r.STATUS,
    RESULT: WETTE ? "HELFEN" : "OK",
    SCORE,
    WETTE,
    OUT: r.VERWALTUNG3,
    WAHRHEIT: r.WAHRHEIT,
    EDIT: r.IST_IST
  };
}

// ------------------------------------------------------
// BIL SUPERPOSITION / MAUS
// ------------------------------------------------------
async function BIL_MAUS_START() {
  try {
    const r = await fetch("./BIL/RAUM.json");
    const data = await r.json();

    const out = ghostScan(data);

    window.BIL_RAUM   = out.RAUM;
    window.BIL_STATUS = out.STATUS;
    window.BIL_SCORE  = out.SCORE;
    window.BIL_WETTE  = out.WETTE;
    window.BIL_RESULT = out.RESULT;

    NC_MAIBOARD(out);

  } catch(e) {
    console.error("BIL-MAUS FEHLER:", e);
  }
}

// ------------------------------------------------------
// NC‑MAIBOARD (FRAGT statt antwortet)
// ------------------------------------------------------
function NC_MAIBOARD(out){

  const board = document.getElementById("board");
  board.innerHTML = "";

  function ask(q, v){
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML =
      `<span class='question'>${q}</span> 
       <span class='value'>${v}</span>`;
    board.appendChild(div);
  }

  // LISTEN & INDEXE aus index.html
  ask("Welche LISTE schlummert in index.html?", "BIL.json, REAL.json, RAUM.json");
  ask("Welcher INDEX ist aktiv?", out.ID);

  // RESPO
  ask("Welche WAHRHEIT trägt der Raum?", out.WAHRHEIT);
  ask("Welche WETTE ist gesetzt?", out.WETTE);
  ask("Welcher SCORE wurde erzeugt?", out.SCORE);

  // RAUM
  ask("Welche RAUM‑Koordinate ist aktiv?", `X=${out.RAUM.X}, Z=${out.RAUM.Z}`);

  // SUPERPOSITION
  ask("Welche Superposition ist aktiv?", out.RESULT);

  // ENGINE
  ask("Welche Engine‑Frage stellt sich als Nächstes?", "AUTO‑NC‑ATTACK?");
}

// ------------------------------------------------------
// Starten
// ------------------------------------------------------
BIL_MAUS_START();

</script>

</body>
</html>
