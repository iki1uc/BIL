<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NC‑LEMMINGE / AUTO‑ENGINE</title>

<style>
  body { background:#111; color:#eee; font-family:monospace; }
  .board { padding:20px; border:1px solid #444; margin:20px; }
  .entry { padding:6px; margin:4px 0; border-bottom:1px solid #333; }
  .question { color:#6cf; }
  .value { color:#fc6; }
  .lemming { color:#9f6; }
  .aua { color:#f66; }
</style>
</head>

<body>

<h1>NC‑LEMMINGE / AUTO‑ENGINE</h1>
<div id="board" class="board"></div>

<script>

// ------------------------------------------------------
// RESPO / AXIOM-PRÜFER
// ------------------------------------------------------
function ghostScan(r){
  if(r.MISS){
    return {
      NAME: r.NAME,
      RESULT: "FEHLT",
      ERROR: true,
      RAUM: "(keine Daten)"
    };
  }

  const WETTE = r.IST_IST !== r.SOLL;

  const SCORE =
      (r.STATUS === "1" ? 1 : 0) +
      (r.VERWALTUNG3.SET.UP ? 1 : 0) +
      (r.VERWALTUNG3.IO.IN ? 1 : 0) +
      (r.VERWALTUNG3.EXE.RUN ? 1 : 0) +
      (r.WAHRHEIT === "REAL" ? 1 : 0) +
      (r.RAUM.X + r.RAUM.Z);

  return {
    NAME: r.NAME,
    ID: r.ID,
    RAUM: r.RAUM,
    STATUS: r.STATUS,
    RESULT: WETTE ? "HELFEN" : "OK",
    SCORE,
    WETTE,
    OUT: r.VERWALTUNG3,
    WAHRHEIT: r.WAHRHEIT,
    EDIT: r.IST_IST
  };
}

// ------------------------------------------------------
// BIL SUPERPOSITION / MAUS
// ------------------------------------------------------
async function BIL_MAUS_START() {
  try {
    const r = await fetch("./BIL/RAUM.json");
    const data = await r.json();

    const out = ghostScan(data);

    window.BIL_RAUM   = out.RAUM;
    window.BIL_STATUS = out.STATUS;
    window.BIL_SCORE  = out.SCORE;
    window.BIL_WETTE  = out.WETTE;
    window.BIL_RESULT = out.RESULT;

    NC_LEMMINGE(out);

  } catch(e) {
    console.error("BIL-MAUS FEHLER:", e);
  }
}

// ------------------------------------------------------
// NC‑LEMMINGE (laufen alle Wege ab)
// ------------------------------------------------------
function NC_LEMMINGE(out){

  const board = document.getElementById("board");
  board.innerHTML = "";

  function ask(q, v){
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML =
      `<span class='question'>${q}</span> 
       <span class='value'>${v}</span>`;
    board.appendChild(div);
  }

  function lemming(path){
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML =
      `<span class='lemming'>LEMMING geht Weg:</span> 
       <span class='value'>${path}</span>`;
    board.appendChild(div);
  }

  function aua(flag){
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML =
      `<span class='aua'>AUA‑Feedback:</span> 
       <span class='value'>${flag}</span>`;
    board.appendChild(div);
  }

  // Lemminge laufen alle Wege ab
  lemming("RAUM → X=" + out.RAUM.X);
  lemming("RAUM → Z=" + out.RAUM.Z);
  lemming("WETTE → " + out.WETTE);
  lemming("SCORE → " + out.SCORE);
  lemming("SUPERPOSITION → " + out.RESULT);

  // AUA‑Fähigkeit (Engine‑Feedback)
  if(out.WETTE){
    aua("WETTE‑KOLLISION");
  } else {
    aua("KEINE KOLLISION");
  }

  if(out.SCORE < 10){
    aua("SCORE‑UNTERLAUF");
  } else {
    aua("SCORE‑OK");
  }

  // MAIBOARD‑Fragen
  ask("Welche LISTE schlummert in index.html?", "BIL.json, REAL.json, RAUM.json");
  ask("Welcher INDEX ist aktiv?", out.ID);
  ask("Welche WAHRHEIT trägt der Raum?", out.WAHRHEIT);
  ask("Welche Engine‑Frage stellt sich als Nächstes?", "LEMMING‑NC‑ATTACK?");
}

// ------------------------------------------------------
// Starten
// ------------------------------------------------------
BIL_MAUS_START();

</script>

</body>
</html>
