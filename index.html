<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BIL / RUN 8 / Pipeline 4→0→1→2</title>
<link rel="stylesheet" href="16.css">
<style>
  body { background:#000; color:#0f0; font-family:monospace; }
  #out { padding:20px; border:1px solid #0f0; margin:20px; white-space:pre; }
</style>
</head>

<body>

<h1>BIL / RUN 8 / Pipeline 4→0→1→2</h1>
<div id="out"></div>

<script>

async function LOAD_BIL(){
  const RAUM = await (await fetch("RAUM.json")).json();
  const REAL = await (await fetch("REAL.json")).json();
  const BIL  = await (await fetch("BIL.json")).json();

  const LIST = await (await fetch("LIST.rom")).text();
  const RUN  = await (await fetch("RUN.rom")).text();
  const ROM16 = await (await fetch("16k.ROM")).text();

  PIPELINE(RAUM, REAL, BIL, LIST, RUN, ROM16);
}

function PIPELINE(RAUM, REAL, BIL, LIST, RUN, ROM16){

  const out = document.getElementById("out");
  out.innerHTML = "";

  const V4 = {
    X: RAUM.X,
    Z: RAUM.Z,
    W: REAL.WAHRHEIT,
    S: REAL.STATUS
  };

  const emergent = {
    ECHO: BIL.ECHO,
    PULSE: RUN.includes("8") ? "RUN8" : "RUN"
  };

  const SUPERLAGE = {
    E0: BIL.SUPERLAGE,
    DRIFT: BIL.DRIFT,
    FALL: BIL.FALL
  };

  const ORBIT = REAL.ORBIT;

  const PULSE = RUN.includes("8") ? "Tock" : "Tick";

  const STATION = {
    S1: BIL.ST1,
    S2: BIL.ST2,
    S3: BIL.ST3,
    S4: BIL.ST4
  };

  const RASTER = {
    R1: V4.X,
    R2: V4.Z,
    R3: emergent.ECHO,
    R4: emergent.PULSE,
    R5: SUPERLAGE.DRIFT,
    R6: SUPERLAGE.FALL
  };

  out.innerHTML += "PIPELINE 4 → 0 → 1 → 2\n\n";
  out.innerHTML += "4 (VECTOR)\n";
  out.innerHTML += JSON.stringify(V4, null, 2) + "\n\n";

  out.innerHTML += "0 (SUPERLAGE)\n";
  out.innerHTML += JSON.stringify(SUPERLAGE, null, 2) + "\n\n";

  out.innerHTML += "1 (ORBIT)\n";
  out.innerHTML += JSON.stringify(ORBIT, null, 2) + "\n\n";

  out.innerHTML += "2 (PULSE / RUN 8)\n";
  out.innerHTML += JSON.stringify({PULSE}, null, 2) + "\n\n";

  out.innerHTML += "STATIONEN\n";
  out.innerHTML += JSON.stringify(STATION, null, 2) + "\n\n";

  out.innerHTML += "RASTER (6e)\n";
  out.innerHTML += JSON.stringify(RASTER, null, 2) + "\n\n";
}

LOAD_BIL();

</script>

</body>
</html>
