<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO · SUPERLAGE · 3×11 Viewer</title>

<link rel="stylesheet" href="16.css">

<style>
body {
    background:#000;
    color:#0ff;
    font-family:Consolas;
    margin:0;
    overflow:hidden;
}

#grid {
    display:grid;
    grid-template-columns:repeat(11, 1fr);
    grid-auto-rows:200px;
    gap:4px;
    padding:10px;
    height:100vh;
    overflow-y:scroll;
    transform:scale(1);
    transition:transform 0.3s ease;
}

.cell {
    background:#111;
    border:1px solid #333;
    padding:10px;
    overflow:auto;
    white-space:pre-wrap;
}

#grid.zoom {
    transform:scale(1.4);
}
</style>

<script type="module">
import { move1 } from "./move1.js";
import { move2 } from "./move2.js";
import { move3 } from "./move3.js";

async function loadFile(path) {
    try {
        const res = await fetch(path);
        const txt = await res.text();
        return {path, txt};
    } catch(e) {
        return {path, txt:"[Fehler beim Laden]"};
    }
}

async function start() {

    const files = [
        "BIL.json",
        "RAUM.json",
        "REAL.json",
        "GO.rom",
        "RUN.rom",
        "RUNE.RUN.js",
        "RUNE.LIST.js",
        "LIST.rom",
        "ID.html",
        "index.html",
        "RUNE.LIST.rom",
        "16.css",
        "16k.ROM",
        "RAW.mp3",
        "time_3x11_scroll_zoom.html"
    ];

    const grid = document.getElementById("grid");

    let i = 0;
    for (const f of files) {
        const data = await loadFile(f);

        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `# ${data.path}\n\n${data.txt}`;

        // org / arg / arg3te layer separation
        cell.dataset.org = i;
        cell.dataset.arg = i % 3;
        cell.dataset.arg3te = (i % 3) * 0.333;

        // Shuffle‑Dance Moves
        if (cell.dataset.arg == 0) move1(cell);   // Running-Man
        if (cell.dataset.arg == 1) move2(cell);   // T-Step
        if (cell.dataset.arg == 2) move3(cell);   // Glide

        grid.appendChild(cell);
        i++;
    }

    // loop animation for superlage
    setInterval(() => {
        grid.classList.toggle("zoom");
    }, 3000);
}

start();
</script>

</head>

<body>

<h1 style="text-align:center;color:#6cf;padding:10px;">RESPO · SUPERLAGE · 3×11</h1>
<div id="grid"></div>

</body>
</html>
